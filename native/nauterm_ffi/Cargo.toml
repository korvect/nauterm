[package]
name = "nauterm_ffi"
version = "0.3.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["terminal-ghostty"]
integration-tests = []
test-credential-store = []
terminal-ghostty = []

[dependencies]
aes-gcm = "0.10"
alacritty_terminal = { version = "0.26.0", default-features = false }
argon2 = "0.5"
base64 = "0.23"
hkdf = "0.12"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
libc = "0.2"
libloading = "0.9"
polling = "3"
png = "0.18"
opendal = { version = "0.57", default-features = false, features = [
    "executors-tokio",
    "layers-retry",
    "layers-timeout",
    "reqwest-rustls-tls",
    "services-s3",
    "services-webdav",
    "services-azblob",
    "services-gcs",
    "services-gdrive",
    "services-onedrive",
    "services-dropbox",
] }
rand_core = { version = "0.6", features = ["getrandom"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
socket2 = "0.6.3"
encoding_rs = "0.8.35"
futures-util = "0.3"
rusqlite = { version = "0.40", features = ["bundled-sqlcipher", "backup"] }
russh = { version = "0.61", default-features = false, features = ["ring"] }
russh-sftp = "2.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10"
tokio = { version = "1", features = ["io-util", "net", "rt-multi-thread", "sync", "time"] }
unicode-normalization = "0.1"
url = "2"
percent-encoding = "2"
zeroize = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
opendal = { version = "0.57", default-features = false, features = [
    "executors-tokio",
    "services-memory",
] }
