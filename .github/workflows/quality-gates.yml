name: Quality Gates

on:
  workflow_call:
    inputs:
      integration:
        description: Run desktop integration tests on all supported operating systems
        required: false
        type: boolean
        default: false
    secrets:
      MOSH_REPOSITORY_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      integration:
        description: Run desktop integration tests on Linux, macOS, and Windows
        required: true
        type: boolean
        default: false

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.44.6
  RUST_TOOLCHAIN: 1.97.0
  ZIG_VERSION: 0.16.0
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Flutter, Rust, Mosh, and release metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Install Linux native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Verify release metadata and generated assets
        run: |
          bash scripts/ci/verify_versions.sh
          bash scripts/ci/verify_app_icons.sh
          bash scripts/ci/verify_mosh_artifacts.sh

      - id: mosh-source
        name: Read pinned Mosh revision
        run: echo "revision=$(tr -d '[:space:]' < third_party/nauterm_mosh_ffi/SOURCE_REVISION)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: korvect/nauterm-mosh
          ref: ${{ steps.mosh-source.outputs.revision }}
          path: nauterm-mosh
          token: ${{ secrets.MOSH_REPOSITORY_TOKEN || github.token }}

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy
          rustup default "$RUST_TOOLCHAIN"

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Check Dart formatting
        continue-on-error: true
        run: dart format --output=none --set-exit-if-changed lib test test_integration

      - name: Analyze Flutter
        continue-on-error: true
        run: flutter analyze --no-pub

      - name: Build native library for Flutter tests
        run: cargo build --manifest-path native/nauterm_ffi/Cargo.toml --locked --features test-credential-store

      - name: Run Flutter unit tests
        run: flutter test --no-pub

      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          manifest-path: native/nauterm_ffi/Cargo.toml
          command: check licenses
          arguments: --all-features

      - name: Check native Rust formatting
        continue-on-error: true
        run: cargo fmt --manifest-path native/nauterm_ffi/Cargo.toml --all -- --check

      - name: Run native Rust Clippy
        run: cargo clippy --manifest-path native/nauterm_ffi/Cargo.toml --all-targets --locked -- -D warnings

      - name: Run native Rust unit tests
        run: cargo test --manifest-path native/nauterm_ffi/Cargo.toml --locked --features test-credential-store

      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          manifest-path: nauterm-mosh/Cargo.toml
          command: check licenses
          arguments: --all-features

      - name: Check Mosh formatting
        continue-on-error: true
        run: cargo fmt --all -- --check
        working-directory: nauterm-mosh

      - name: Run Mosh Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
        working-directory: nauterm-mosh

      - name: Run Mosh unit tests
        run: cargo test --workspace --locked
        working-directory: nauterm-mosh

      - name: Build and verify the Mosh ABI
        run: cargo build --package nauterm_mosh_ffi --locked
        working-directory: nauterm-mosh

      - run: bash scripts/ci/check_mosh_abi.sh nauterm-mosh

      - run: bash scripts/ci/verify_mosh_artifacts.sh nauterm-mosh

  integration:
    name: Integration (${{ matrix.os }})
    needs: quality
    if: inputs.integration
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-24.04, macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - uses: ilammy/msvc-dev-cmd@7defe9254715b088f12dddd9942945a3d75cdad5 # v1.9.0
        if: runner.os == 'Windows'
        with:
          arch: amd64

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install ${{ env.RUST_TOOLCHAIN }} --profile minimal
          rustup default ${{ env.RUST_TOOLCHAIN }}

      - name: Install Linux integration dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fish libdbus-1-dev pkg-config tmux

      - name: Install macOS integration dependencies
        if: runner.os == 'macOS'
        run: brew install fish tmux

      - name: Install and configure Windows OpenSSL
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/ci/setup_windows_openssl.ps1

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Run native integration tests
        run: cargo test --manifest-path native/nauterm_ffi/Cargo.toml --locked --features integration-tests,test-credential-store -- --test-threads=1

      - name: Build the native test library
        run: cargo build --manifest-path native/nauterm_ffi/Cargo.toml --locked --features test-credential-store

      - name: Run Flutter integration tests
        run: flutter test --no-pub test_integration
