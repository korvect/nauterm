name: Release Packages

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        type: choice
        default: all
        options:
          - all
          - macos
          - linux
          - windows
      arch:
        description: Architecture to build
        type: choice
        default: all
        options:
          - all
          - x86_64
          - arm64
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.44.6
  RUST_TOOLCHAIN: 1.97.0
  NAUTERM_BUILD_NUMBER: ${{ github.run_number }}
  NAUTERM_UPDATE_REPOSITORY: ${{ vars.NAUTERM_UPDATE_REPOSITORY || github.repository }}
  NAUTERM_GITHUB_CLIENT_ID: ${{ vars.NAUTERM_GITHUB_CLIENT_ID }}
  NAUTERM_GOOGLE_CLIENT_ID: ${{ vars.NAUTERM_GOOGLE_CLIENT_ID }}
  NAUTERM_ONEDRIVE_CLIENT_ID: ${{ vars.NAUTERM_ONEDRIVE_CLIENT_ID }}
  NAUTERM_DROPBOX_CLIENT_ID: ${{ vars.NAUTERM_DROPBOX_CLIENT_ID }}

concurrency:
  group: release-packages-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  quality-gates:
    uses: ./.github/workflows/quality-gates.yml
    with:
      integration: false
    secrets:
      MOSH_REPOSITORY_TOKEN: ${{ secrets.MOSH_REPOSITORY_TOKEN }}

  select-builds:
    name: Select builds
    needs: quality-gates
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      macos_enabled: ${{ steps.select.outputs.macos_enabled }}
      macos_matrix: ${{ steps.select.outputs.macos_matrix }}
      linux_enabled: ${{ steps.select.outputs.linux_enabled }}
      linux_matrix: ${{ steps.select.outputs.linux_matrix }}
      windows_enabled: ${{ steps.select.outputs.windows_enabled }}
      windows_matrix: ${{ steps.select.outputs.windows_matrix }}
    steps:
      - name: Verify release build configuration
        run: |
          set -euo pipefail
          for name in \
            NAUTERM_UPDATE_REPOSITORY \
            NAUTERM_GITHUB_CLIENT_ID \
            NAUTERM_GOOGLE_CLIENT_ID; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required release build configuration: $name" >&2
              exit 1
            fi
          done

      - id: select
        env:
          REQUESTED_PLATFORM: ${{ github.event_name == 'workflow_dispatch' && inputs.platform || 'all' }}
          REQUESTED_ARCH: ${{ github.event_name == 'workflow_dispatch' && inputs.arch || 'all' }}
        run: |
          set -euo pipefail

          macos_include=()
          linux_include=()
          windows_include=()

          wants_platform() {
            [ "$REQUESTED_PLATFORM" = "all" ] || [ "$REQUESTED_PLATFORM" = "$1" ]
          }

          wants_arch() {
            [ "$REQUESTED_ARCH" = "all" ] || [ "$REQUESTED_ARCH" = "$1" ]
          }

          if wants_platform macos; then
            if wants_arch x86_64; then
              macos_include+=('{"arch":"x86_64","runner":"macos-26-intel"}')
            fi
            if wants_arch arm64; then
              macos_include+=('{"arch":"arm64","runner":"macos-26"}')
            fi
          fi

          if wants_platform linux && wants_arch x86_64; then
            linux_include+=('{"arch":"x86_64","runner":"ubuntu-24.04","deb_arch":"amd64","rpm_arch":"x86_64","appimage_arch":"x86_64"}')
          fi

          if wants_platform linux && wants_arch arm64; then
            linux_include+=('{"arch":"arm64","runner":"ubuntu-24.04-arm","deb_arch":"arm64","rpm_arch":"aarch64","appimage_arch":"aarch64"}')
          fi

          if wants_platform windows && wants_arch x86_64; then
            windows_include+=('{"arch":"x86_64","runner":"windows-2025"}')
          fi

          if wants_platform windows && wants_arch arm64; then
            windows_include+=('{"arch":"arm64","runner":"windows-11-arm"}')
          fi

          join_json_array() {
            local joined=""
            local item
            for item in "$@"; do
              if [ -n "$joined" ]; then
                joined="$joined,$item"
              else
                joined="$item"
              fi
            done
            printf '{"include":[%s]}' "$joined"
          }

          macos_matrix="$(join_json_array "${macos_include[@]}")"
          linux_matrix="$(join_json_array "${linux_include[@]}")"
          windows_matrix="$(join_json_array "${windows_include[@]}")"

          macos_enabled=false
          linux_enabled=false
          windows_enabled=false
          [ "${#macos_include[@]}" -gt 0 ] && macos_enabled=true
          [ "${#linux_include[@]}" -gt 0 ] && linux_enabled=true
          [ "${#windows_include[@]}" -gt 0 ] && windows_enabled=true

          if [ "$macos_enabled" != true ] && [ "$linux_enabled" != true ] && [ "$windows_enabled" != true ]; then
            echo "No builds match platform=$REQUESTED_PLATFORM arch=$REQUESTED_ARCH" >&2
            exit 1
          fi

          {
            echo "macos_enabled=$macos_enabled"
            echo "macos_matrix=$macos_matrix"
            echo "linux_enabled=$linux_enabled"
            echo "linux_matrix=$linux_matrix"
            echo "windows_enabled=$windows_enabled"
            echo "windows_matrix=$windows_matrix"
          } >> "$GITHUB_OUTPUT"

  macos:
    name: macOS ${{ matrix.arch }}
    needs: select-builds
    if: needs.select-builds.outputs.macos_enabled == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.select-builds.outputs.macos_matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - id: version
        run: |
          echo "value=$(awk '/^version: / { split($2, parts, "+"); print parts[1]; exit }' pubspec.yaml)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Install macOS integration dependencies
        if: matrix.arch == 'arm64'
        run: brew install fish tmux

      - name: Run native integration tests
        if: matrix.arch == 'arm64'
        run: cargo test --manifest-path native/nauterm_ffi/Cargo.toml --locked --features integration-tests,test-credential-store -- --test-threads=1

      - name: Build the native test library
        if: matrix.arch == 'arm64'
        run: cargo build --manifest-path native/nauterm_ffi/Cargo.toml --locked --features test-credential-store

      - name: Run Flutter integration tests
        if: matrix.arch == 'arm64'
        run: flutter test --no-pub test_integration

      - name: Build macOS packages
        env:
          NAUTERM_SKIP_PUB_GET: "1"
          NAUTERM_GOOGLE_CLIENT_SECRET: ${{ secrets.NAUTERM_GOOGLE_CLIENT_SECRET }}
          NAUTERM_POSTHOG_API_KEY: ${{ vars.NAUTERM_POSTHOG_API_KEY }}
          NAUTERM_POSTHOG_HOST: ${{ vars.NAUTERM_POSTHOG_HOST }}
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
        run: make package-macos-${{ matrix.arch }}

      - name: Generate signed Sparkle appcast
        if: startsWith(github.ref, 'refs/tags/')
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: bash scripts/ci/generate_sparkle_appcast.sh ${{ matrix.arch }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nauterm-${{ steps.version.outputs.value }}-macos-${{ matrix.arch }}
          path: |
            dist/Nauterm-${{ steps.version.outputs.value }}-macos-${{ matrix.arch }}.app.zip
            dist/Nauterm-${{ steps.version.outputs.value }}-macos-${{ matrix.arch }}.dmg
            dist/appcast-${{ matrix.arch }}.xml
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'push' && 1 || 7 }}

  linux:
    name: Linux ${{ matrix.arch }}
    needs: select-builds
    if: needs.select-builds.outputs.linux_enabled == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.select-builds.outputs.linux_matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - id: version
        run: |
          echo "value=$(awk '/^version: / { split($2, parts, "+"); print parts[1]; exit }' pubspec.yaml)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        if: matrix.arch == 'x86_64'
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # Flutter has no arm64 Linux SDK bundle (flutter-action fails on arm64
      # runners). `git clone` + bin/flutter self-bootstraps the per-arch Dart
      # SDK and linux-arm64 engine, so the build runs natively. Verified on
      # ubuntu-24.04-arm.
      - name: Install Flutter (arm64-native via git clone)
        if: matrix.arch == 'arm64'
        run: |
          git clone --depth 1 --branch "${FLUTTER_VERSION}" https://github.com/flutter/flutter.git "$HOME/flutter-sdk"
          export PATH="$HOME/flutter-sdk/bin:$PATH"
          echo "$HOME/flutter-sdk/bin" >> "$GITHUB_PATH"
          flutter --version

      - name: Install build and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            curl \
            file \
            fish \
            build-essential \
            libayatana-appindicator3-dev \
            libblkid-dev \
            libgtk-3-dev \
            liblzma-dev \
            ninja-build \
            pkg-config \
            rpm \
            ruby \
            ruby-dev \
            tmux
          sudo gem install fpm --version 1.17.0 --no-document

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Run native integration tests
        run: cargo test --manifest-path native/nauterm_ffi/Cargo.toml --locked --features integration-tests,test-credential-store -- --test-threads=1

      - name: Build the native test library
        run: cargo build --manifest-path native/nauterm_ffi/Cargo.toml --locked --features test-credential-store

      - name: Run Flutter integration tests
        run: flutter test --no-pub test_integration

      - name: Build Linux packages
        env:
          NAUTERM_SKIP_PUB_GET: "1"
          NAUTERM_GOOGLE_CLIENT_SECRET: ${{ secrets.NAUTERM_GOOGLE_CLIENT_SECRET }}
          NAUTERM_POSTHOG_API_KEY: ${{ vars.NAUTERM_POSTHOG_API_KEY }}
          NAUTERM_POSTHOG_HOST: ${{ vars.NAUTERM_POSTHOG_HOST }}
        run: make package-linux-${{ matrix.arch }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nauterm-${{ steps.version.outputs.value }}-linux-${{ matrix.arch }}
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage.tar.gz
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'push' && 1 || 7 }}

  windows:
    name: Windows ${{ matrix.arch }}
    needs: select-builds
    if: needs.select-builds.outputs.windows_enabled == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.select-builds.outputs.windows_matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - id: version
        shell: pwsh
        run: |
          $version = ((Get-Content pubspec.yaml | Where-Object { $_ -match '^version:\s+' } | Select-Object -First 1) -replace '^version:\s+', '') -split '\+' | Select-Object -First 1
          "value=$version" >> $env:GITHUB_OUTPUT

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        if: matrix.arch == 'x86_64'
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # Flutter has no arm64 Windows SDK bundle (flutter-action installs the
      # x86_64 SDK, which cannot produce arm64 binaries). `git clone` +
      # bin/flutter self-bootstraps the per-arch Dart SDK and windows-arm64
      # engine, so the build runs natively on windows-11-arm.
      - name: Install Flutter (arm64-native via git clone)
        if: matrix.arch == 'arm64'
        shell: bash
        run: |
          git clone --depth 1 --branch "${FLUTTER_VERSION}" https://github.com/flutter/flutter.git "C:/flutter-sdk"
          echo "C:/flutter-sdk/bin" >> "$GITHUB_PATH"
          "C:/flutter-sdk/bin/flutter" --version

      - name: Install pinned Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install $env:RUST_TOOLCHAIN --profile minimal
          rustup default $env:RUST_TOOLCHAIN
          if ("${{ matrix.arch }}" -eq "arm64") {
            rustup target add aarch64-pc-windows-msvc
          }

      - name: Install and configure Windows OpenSSL (x86_64)
        if: matrix.arch == 'x86_64'
        shell: pwsh
        run: ./scripts/ci/setup_windows_openssl.ps1

      # arm64 OpenSSL: the choco `openssl` package is x64-only, so install the
      # matching-version arm64 prebuilt from slproweb (the same source as the
      # x86_64 build uses). CMake's find_library searches lib/VC/arm64/MD.
      - name: Install Windows OpenSSL (arm64)
        if: matrix.arch == 'arm64'
        shell: pwsh
        run: |
          $version = "4.0.1"
          $url = "https://slproweb.com/download/Win64ARMOpenSSL-$($version.Replace('.', '_')).exe"
          $installer = "$env:TEMP\Win64ARMOpenSSL.exe"
          Write-Host "Downloading $url"
          Invoke-WebRequest -Uri $url -OutFile $installer -UseBasicParsing
          Write-Host "Installing arm64 OpenSSL $version"
          Start-Process -Wait -FilePath $installer -ArgumentList "/VERYSILENT", "/DIR=C:\OpenSSL-Win-arm64"
          $opensslDir = "C:\OpenSSL-Win-arm64"
          $opensslLibDir = Join-Path $opensslDir "lib\VC\arm64\MD"
          if (-not (Test-Path (Join-Path $opensslLibDir "libcrypto.lib"))) {
            throw "arm64 OpenSSL libcrypto.lib not found at $opensslLibDir"
          }
          Add-Content -Path $env:GITHUB_ENV -Value "OPENSSL_DIR=$opensslDir"
          Add-Content -Path $env:GITHUB_ENV -Value "OPENSSL_INCLUDE_DIR=$(Join-Path $opensslDir 'include')"
          Add-Content -Path $env:GITHUB_ENV -Value "OPENSSL_LIB_DIR=$opensslLibDir"
          Add-Content -Path $env:GITHUB_ENV -Value "LIB=$opensslLibDir;$env:LIB"
          # Runtime DLLs (libcrypto-3-arm64.dll) live in OpenSSL's bin dir;
          # nauterm_ffi links OpenSSL (via rusqlite's bundled-sqlcipher), so the
          # test executable needs them on PATH or it fails with
          # STATUS_DLL_NOT_FOUND (0xc0000135).
          Add-Content -Path $env:GITHUB_PATH -Value "C:\OpenSSL-Win-arm64\bin"

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Run native integration tests
        run: cargo test --manifest-path native/nauterm_ffi/Cargo.toml --locked --features integration-tests,test-credential-store -- --test-threads=1

      - name: Build the native test library
        run: cargo build --manifest-path native/nauterm_ffi/Cargo.toml --locked --features test-credential-store

      - name: Run Flutter integration tests
        run: flutter test --no-pub test_integration

      - name: Install Windows packaging dependencies
        shell: pwsh
        run: choco install make innosetup -y --no-progress

      - name: Build Windows package
        shell: bash
        env:
          NAUTERM_SKIP_PUB_GET: "1"
          NAUTERM_GOOGLE_CLIENT_SECRET: ${{ secrets.NAUTERM_GOOGLE_CLIENT_SECRET }}
          NAUTERM_POSTHOG_API_KEY: ${{ vars.NAUTERM_POSTHOG_API_KEY }}
          NAUTERM_POSTHOG_HOST: ${{ vars.NAUTERM_POSTHOG_HOST }}
        run: make package-windows-${{ matrix.arch }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nauterm-${{ steps.version.outputs.value }}-windows-${{ matrix.arch }}
          path: |
            dist/*-setup.exe
            dist/*.zip
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'push' && 1 || 7 }}

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    needs:
      - quality-gates
      - macos
      - linux
      - windows
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Verify release versions
        run: bash scripts/ci/verify_versions.sh release-artifacts

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          cd release-artifacts
          RELEASE_TITLE="Nauterm ${TAG_NAME#v}"
          sha256sum * > SHA256SUMS.txt
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" * --clobber
            gh release edit "$TAG_NAME" --title "$RELEASE_TITLE"
          else
            gh release create "$TAG_NAME" * --title "$RELEASE_TITLE" --generate-notes
          fi
