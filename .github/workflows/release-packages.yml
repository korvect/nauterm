name: Release Packages

on:
  workflow_dispatch:
    inputs:
      client:
        description: Client to build
        type: choice
        default: all
        options:
          - all
          - flutter
          - rust
      platform:
        description: Platform to build
        type: choice
        default: all
        options:
          - all
          - macos
          - linux
          - windows
      arch:
        description: Architecture to build
        type: choice
        default: all
        options:
          - all
          - x86_64
          - arm64
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.50.1
  RUST_TOOLCHAIN: 1.99.1
  ZIG_VERSION: 0.17.0
  RELEASE_CLIENT: ${{ inputs.client || 'all' }}
  NAUTERM_BUILD_NUMBER: ${{ github.run_number }}
  NAUTERM_UPDATE_REPOSITORY: ${{ vars.NAUTERM_UPDATE_REPOSITORY || github.repository }}
  NAUTERM_GITHUB_CLIENT_ID: ${{ vars.NAUTERM_GITHUB_CLIENT_ID }}
  NAUTERM_GOOGLE_CLIENT_ID: ${{ vars.NAUTERM_GOOGLE_CLIENT_ID }}
  NAUTERM_ONEDRIVE_CLIENT_ID: ${{ vars.NAUTERM_ONEDRIVE_CLIENT_ID }}
  NAUTERM_DROPBOX_CLIENT_ID: ${{ vars.NAUTERM_DROPBOX_CLIENT_ID }}

concurrency:
  group: release-packages-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  quality-gates:
    uses: ./.github/workflows/quality-gates.yml
    with:
      client: ${{ inputs.client || 'all' }}
      integration: false

  select-builds:
    name: Select builds
    needs: quality-gates
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      macos_enabled: ${{ steps.select.outputs.macos_enabled }}
      macos_matrix: ${{ steps.select.outputs.macos_matrix }}
      linux_enabled: ${{ steps.select.outputs.linux_enabled }}
      linux_matrix: ${{ steps.select.outputs.linux_matrix }}
      windows_enabled: ${{ steps.select.outputs.windows_enabled }}
      windows_matrix: ${{ steps.select.outputs.windows_matrix }}
    steps:
      - name: Verify release build configuration
        run: |
          set -euo pipefail
          for name in \
            NAUTERM_UPDATE_REPOSITORY \
            NAUTERM_GITHUB_CLIENT_ID \
            NAUTERM_GOOGLE_CLIENT_ID; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required release build configuration: $name" >&2
              exit 1
            fi
          done

      - id: select
        env:
          REQUESTED_PLATFORM: ${{ github.event_name == 'workflow_dispatch' && inputs.platform || 'all' }}
          REQUESTED_ARCH: ${{ github.event_name == 'workflow_dispatch' && inputs.arch || 'all' }}
        run: |
          set -euo pipefail

          macos_include=()
          linux_include=()
          windows_include=()

          wants_platform() {
            [ "$REQUESTED_PLATFORM" = "all" ] || [ "$REQUESTED_PLATFORM" = "$1" ]
          }

          wants_arch() {
            [ "$REQUESTED_ARCH" = "all" ] || [ "$REQUESTED_ARCH" = "$1" ]
          }

          if wants_platform macos; then
            if wants_arch x86_64; then
              macos_include+=('{"arch":"x86_64","runner":"macos-26-intel"}')
            fi
            if wants_arch arm64; then
              macos_include+=('{"arch":"arm64","runner":"xcode-27"}')
            fi
          fi

          if wants_platform linux && wants_arch x86_64; then
            linux_include+=('{"arch":"x86_64","runner":"ubuntu-24.04","deb_arch":"amd64","rpm_arch":"x86_64","appimage_arch":"x86_64"}')
          fi

          if wants_platform linux && wants_arch arm64; then
            linux_include+=('{"arch":"arm64","runner":"ubuntu-24.04-arm","deb_arch":"arm64","rpm_arch":"aarch64","appimage_arch":"aarch64"}')
          fi

          if wants_platform windows && wants_arch x86_64; then
            windows_include+=('{"arch":"x86_64","runner":"windows-2025"}')
          fi

          if wants_platform windows && wants_arch arm64; then
            windows_include+=('{"arch":"arm64","runner":"windows-11-arm"}')
          fi

          join_json_array() {
            local joined=""
            local item
            for item in "$@"; do
              if [ -n "$joined" ]; then
                joined="$joined,$item"
              else
                joined="$item"
              fi
            done
            printf '{"include":[%s]}' "$joined"
          }

          macos_matrix="$(join_json_array "${macos_include[@]}")"
          linux_matrix="$(join_json_array "${linux_include[@]}")"
          windows_matrix="$(join_json_array "${windows_include[@]}")"

          macos_enabled=false
          linux_enabled=false
          windows_enabled=false
          [ "${#macos_include[@]}" -gt 0 ] && macos_enabled=true
          [ "${#linux_include[@]}" -gt 0 ] && linux_enabled=true
          [ "${#windows_include[@]}" -gt 0 ] && windows_enabled=true

          if [ "$macos_enabled" != true ] && [ "$linux_enabled" != true ] && [ "$windows_enabled" != true ]; then
            echo "No builds match platform=$REQUESTED_PLATFORM arch=$REQUESTED_ARCH" >&2
            exit 1
          fi

          {
            echo "macos_enabled=$macos_enabled"
            echo "macos_matrix=$macos_matrix"
            echo "linux_enabled=$linux_enabled"
            echo "linux_matrix=$linux_matrix"
            echo "windows_enabled=$windows_enabled"
            echo "windows_matrix=$windows_matrix"
          } >> "$GITHUB_OUTPUT"

  macos:
    name: macOS ${{ matrix.arch }}
    needs: select-builds
    if: needs.select-builds.outputs.macos_enabled == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.select-builds.outputs.macos_matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install prebuilt libghostty-vt
        run: bash scripts/ci/install_ghostty_macos.sh

      - id: version
        run: |
          echo "value=$(awk '/^version: / { split($2, parts, "+"); print parts[1]; exit }' pubspec.yaml)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        if: env.RELEASE_CLIENT != 'rust'
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"

      - name: Resolve Flutter dependencies
        if: env.RELEASE_CLIENT != 'rust'
        run: flutter pub get

      - name: Install macOS integration dependencies
        if: matrix.arch == 'arm64'
        run: brew install fish tmux

      - name: Run native integration tests
        if: matrix.arch == 'arm64'
        run: cargo test --manifest-path native/nauterm_core/Cargo.toml --locked --features integration-tests,test-credential-store -- --test-threads=1

      - name: Build the native test library
        if: env.RELEASE_CLIENT != 'rust' && matrix.arch == 'arm64'
        run: cargo build --manifest-path native/nauterm_core/Cargo.toml --locked --features test-credential-store

      - name: Run Flutter integration tests
        if: env.RELEASE_CLIENT != 'rust' && matrix.arch == 'arm64'
        run: flutter test --no-pub test_integration

      - name: Build Flutter macOS packages
        if: env.RELEASE_CLIENT != 'rust'
        env:
          NAUTERM_SKIP_PUB_GET: "1"
          NAUTERM_GOOGLE_CLIENT_SECRET: ${{ secrets.NAUTERM_GOOGLE_CLIENT_SECRET }}
          NAUTERM_POSTHOG_API_KEY: ${{ vars.NAUTERM_POSTHOG_API_KEY }}
          NAUTERM_POSTHOG_HOST: ${{ vars.NAUTERM_POSTHOG_HOST }}
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
        run: make flutter-package ARCH=${{ matrix.arch }}

      - name: Configure RS macOS signing
        if: env.RELEASE_CLIENT != 'flutter'
        env:
          NAUTERM_RS_SIGN_CERTIFICATE: ${{ secrets.NAUTERM_RS_SIGN_CERTIFICATE }}
          NAUTERM_RS_SIGN_PASSWORD: ${{ secrets.NAUTERM_RS_SIGN_PASSWORD }}
          NAUTERM_RS_SIGN_IDENTITY: ${{ vars.NAUTERM_RS_SIGN_IDENTITY }}
          NAUTERM_RS_NOTARY_KEY_BASE64: ${{ secrets.NAUTERM_RS_NOTARY_KEY_BASE64 }}
          NAUTERM_RS_NOTARY_KEY_ID: ${{ secrets.NAUTERM_RS_NOTARY_KEY_ID }}
          NAUTERM_RS_NOTARY_ISSUER: ${{ secrets.NAUTERM_RS_NOTARY_ISSUER }}
        run: bash scripts/ci/setup_rs_macos_signing.sh

      - name: Build macOS RS package
        if: env.RELEASE_CLIENT != 'flutter'
        env:
          NAUTERM_GOOGLE_CLIENT_SECRET: ${{ secrets.NAUTERM_GOOGLE_CLIENT_SECRET }}
          NAUTERM_POSTHOG_API_KEY: ${{ vars.NAUTERM_POSTHOG_API_KEY }}
          NAUTERM_POSTHOG_HOST: ${{ vars.NAUTERM_POSTHOG_HOST }}
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
        run: make rs-package ARCH=${{ matrix.arch }}

      - name: Clean up RS signing credentials
        if: always() && env.RELEASE_CLIENT != 'flutter'
        run: bash scripts/ci/setup_rs_macos_signing.sh cleanup

      - name: Generate signed Sparkle appcast
        if: startsWith(github.ref, 'refs/tags/')
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [ "$RELEASE_CLIENT" != rust ]; then
            make flutter-appcast ARCH=${{ matrix.arch }}
          fi
          if [ "$RELEASE_CLIENT" != flutter ]; then
            make rs-appcast ARCH=${{ matrix.arch }}
          fi

      - name: Verify macOS packages
        id: packages
        run: >-
          python3 scripts/ci/verify_release_packages.py dist
          '${{ steps.version.outputs.value }}' "$NAUTERM_BUILD_NUMBER"
          --platform macos --arch '${{ matrix.arch }}' --client "$RELEASE_CLIENT"

      - name: Upload Flutter macOS packages
        if: env.RELEASE_CLIENT != 'rust'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nauterm-${{ steps.version.outputs.value }}-macos-${{ matrix.arch }}
          path: ${{ steps.packages.outputs.flutter }}
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'push' && 1 || 7 }}

      - name: Upload Rust macOS packages
        if: env.RELEASE_CLIENT != 'flutter'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nauterm-rs-${{ steps.version.outputs.value }}-macos-${{ matrix.arch }}
          path: ${{ steps.packages.outputs.rs }}
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'push' && 1 || 7 }}

  linux:
    name: Linux ${{ matrix.arch }}
    needs: select-builds
    if: needs.select-builds.outputs.linux_enabled == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.select-builds.outputs.linux_matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ env.ZIG_VERSION }}
          use-cache: false

      - id: version
        run: |
          echo "value=$(awk '/^version: / { split($2, parts, "+"); print parts[1]; exit }' pubspec.yaml)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        if: env.RELEASE_CLIENT != 'rust' && matrix.arch == 'x86_64'
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # Flutter has no arm64 Linux SDK bundle (flutter-action fails on arm64
      # runners). `git clone` + bin/flutter self-bootstraps the per-arch Dart
      # SDK and linux-arm64 engine, so the build runs natively. Verified on
      # ubuntu-24.04-arm.
      - name: Install Flutter (arm64-native via git clone)
        if: env.RELEASE_CLIENT != 'rust' && matrix.arch == 'arm64'
        run: |
          git clone --depth 1 --branch "${FLUTTER_VERSION}" https://github.com/flutter/flutter.git "$HOME/flutter-sdk"
          export PATH="$HOME/flutter-sdk/bin:$PATH"
          echo "$HOME/flutter-sdk/bin" >> "$GITHUB_PATH"
          flutter --version

      - name: Install build and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            curl \
            file \
            fish \
            build-essential \
            libasound2-dev libclang-dev libdbus-1-dev libfontconfig1-dev \
            libfreetype6-dev libpipewire-0.3-dev libssl-dev libvulkan-dev \
            libwayland-dev libxcb1-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libayatana-appindicator3-dev \
            libblkid-dev \
            libgtk-3-dev \
            libdecor-0-0 libdecor-0-plugin-1-gtk \
            liblzma-dev \
            libudev-dev \
            libx11-dev \
            libxi-dev \
            ninja-build \
            pkg-config \
            rpm \
            ruby \
            ruby-dev \
            tmux
          sudo gem install fpm --version 1.17.0 --no-document

      - name: Build libghostty-vt from release sources
        run: bash scripts/ci/build_ghostty_linux.sh ${{ matrix.arch }}

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"

      - name: Resolve Flutter dependencies
        if: env.RELEASE_CLIENT != 'rust'
        run: flutter pub get

      - name: Run native integration tests
        run: cargo test --manifest-path native/nauterm_core/Cargo.toml --locked --features integration-tests,test-credential-store -- --test-threads=1

      - name: Build the native test library
        if: env.RELEASE_CLIENT != 'rust'
        run: cargo build --manifest-path native/nauterm_core/Cargo.toml --locked --features test-credential-store

      - name: Run Flutter integration tests
        if: env.RELEASE_CLIENT != 'rust'
        run: flutter test --no-pub test_integration

      - name: Build Flutter Linux packages
        if: env.RELEASE_CLIENT != 'rust'
        env:
          NAUTERM_SKIP_PUB_GET: "1"
          NAUTERM_GOOGLE_CLIENT_SECRET: ${{ secrets.NAUTERM_GOOGLE_CLIENT_SECRET }}
          NAUTERM_POSTHOG_API_KEY: ${{ vars.NAUTERM_POSTHOG_API_KEY }}
          NAUTERM_POSTHOG_HOST: ${{ vars.NAUTERM_POSTHOG_HOST }}
        run: make flutter-package ARCH=${{ matrix.arch }}

      - name: Build Linux RS packages
        if: env.RELEASE_CLIENT != 'flutter'
        env:
          CLEAN_DIST: "0"
          NAUTERM_GOOGLE_CLIENT_SECRET: ${{ secrets.NAUTERM_GOOGLE_CLIENT_SECRET }}
          NAUTERM_POSTHOG_API_KEY: ${{ vars.NAUTERM_POSTHOG_API_KEY }}
          NAUTERM_POSTHOG_HOST: ${{ vars.NAUTERM_POSTHOG_HOST }}
        run: make rs-package ARCH=${{ matrix.arch }}


      - name: Verify Linux packages
        id: packages
        run: >-
          python3 scripts/ci/verify_release_packages.py dist
          '${{ steps.version.outputs.value }}' "$NAUTERM_BUILD_NUMBER"
          --platform linux --arch '${{ matrix.arch }}' --client "$RELEASE_CLIENT"

      - name: Upload Flutter Linux packages
        if: env.RELEASE_CLIENT != 'rust'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nauterm-${{ steps.version.outputs.value }}-linux-${{ matrix.arch }}
          path: ${{ steps.packages.outputs.flutter }}
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'push' && 1 || 7 }}

      - name: Upload Rust Linux packages
        if: env.RELEASE_CLIENT != 'flutter'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nauterm-rs-${{ steps.version.outputs.value }}-linux-${{ matrix.arch }}
          path: ${{ steps.packages.outputs.rs }}
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'push' && 1 || 7 }}

  windows:
    name: Windows ${{ matrix.arch }}
    needs: select-builds
    if: needs.select-builds.outputs.windows_enabled == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.select-builds.outputs.windows_matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install prebuilt libghostty-vt
        shell: pwsh
        run: ./scripts/ci/install_ghostty_windows.ps1 -Arch '${{ matrix.arch }}'

      - uses: ilammy/msvc-dev-cmd@7defe9254715b088f12dddd9942945a3d75cdad5 # v1.9.0
        with:
          # Use the native ARM64 MSVC toolchain on windows-11-arm.
          arch: ${{ matrix.arch == 'arm64' && 'arm64' || 'amd64' }}

      - id: version
        shell: pwsh
        run: |
          $version = ((Get-Content pubspec.yaml | Where-Object { $_ -match '^version:\s+' } | Select-Object -First 1) -replace '^version:\s+', '') -split '\+' | Select-Object -First 1
          "value=$version" >> $env:GITHUB_OUTPUT

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        if: env.RELEASE_CLIENT != 'rust' && matrix.arch == 'x86_64'
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # Flutter has no arm64 Windows SDK bundle (flutter-action installs the
      # x86_64 SDK, which cannot produce arm64 binaries). `git clone` +
      # bin/flutter self-bootstraps the per-arch Dart SDK and windows-arm64
      # engine, so the build runs natively on windows-11-arm.
      - name: Install Flutter (arm64-native via git clone)
        if: env.RELEASE_CLIENT != 'rust' && matrix.arch == 'arm64'
        shell: bash
        run: |
          git clone --depth 1 --branch "${FLUTTER_VERSION}" https://github.com/flutter/flutter.git "C:/flutter-sdk"
          echo "C:/flutter-sdk/bin" >> "$GITHUB_PATH"
          "C:/flutter-sdk/bin/flutter" --version

      - name: Install pinned Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install $env:RUST_TOOLCHAIN --profile minimal
          rustup default $env:RUST_TOOLCHAIN
          if ("${{ matrix.arch }}" -eq "arm64") {
            rustup target add aarch64-pc-windows-msvc
          }

      - name: Install and configure Windows OpenSSL
        shell: pwsh
        run: ./scripts/ci/setup_windows_openssl.ps1 -Arch "${{ matrix.arch }}"

      - name: Resolve Flutter dependencies
        if: env.RELEASE_CLIENT != 'rust'
        run: flutter pub get

      - name: Run native integration tests
        run: cargo test --manifest-path native/nauterm_core/Cargo.toml --locked --features integration-tests,test-credential-store -- --test-threads=1

      - name: Build the native test library
        if: env.RELEASE_CLIENT != 'rust'
        run: cargo build --manifest-path native/nauterm_core/Cargo.toml --locked --features test-credential-store

      - name: Run Flutter integration tests
        if: env.RELEASE_CLIENT != 'rust'
        run: flutter test --no-pub test_integration

      - name: Install Windows packaging dependencies
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build Flutter Windows package
        if: env.RELEASE_CLIENT != 'rust'
        shell: pwsh
        env:
          NAUTERM_SKIP_PUB_GET: "1"
          NAUTERM_GOOGLE_CLIENT_SECRET: ${{ secrets.NAUTERM_GOOGLE_CLIENT_SECRET }}
          NAUTERM_POSTHOG_API_KEY: ${{ vars.NAUTERM_POSTHOG_API_KEY }}
          NAUTERM_POSTHOG_HOST: ${{ vars.NAUTERM_POSTHOG_HOST }}
        run: ./scripts/ci/package_windows.ps1 -Arch '${{ matrix.arch }}'

      - name: Build Windows RS packages
        if: env.RELEASE_CLIENT != 'flutter'
        shell: pwsh
        env:
          CLEAN_DIST: "0"
          NAUTERM_GOOGLE_CLIENT_SECRET: ${{ secrets.NAUTERM_GOOGLE_CLIENT_SECRET }}
          NAUTERM_POSTHOG_API_KEY: ${{ vars.NAUTERM_POSTHOG_API_KEY }}
          NAUTERM_POSTHOG_HOST: ${{ vars.NAUTERM_POSTHOG_HOST }}
        run: ./scripts/ci/package_windows.ps1 -Arch '${{ matrix.arch }}' -Client rs


      - name: Verify Windows packages
        id: packages
        shell: pwsh
        run: >-
          python scripts/ci/verify_release_packages.py dist
          '${{ steps.version.outputs.value }}' "$env:NAUTERM_BUILD_NUMBER"
          --platform windows --arch '${{ matrix.arch }}' --client "$env:RELEASE_CLIENT"

      - name: Upload Flutter Windows packages
        if: env.RELEASE_CLIENT != 'rust'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nauterm-${{ steps.version.outputs.value }}-windows-${{ matrix.arch }}
          path: ${{ steps.packages.outputs.flutter }}
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'push' && 1 || 7 }}

      - name: Upload Rust Windows packages
        if: env.RELEASE_CLIENT != 'flutter'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nauterm-rs-${{ steps.version.outputs.value }}-windows-${{ matrix.arch }}
          path: ${{ steps.packages.outputs.rs }}
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'push' && 1 || 7 }}

  release:
    name: Publish GitHub release
    if: >-
      startsWith(github.ref, 'refs/tags/') &&
      (inputs.client || 'all') == 'all' &&
      (inputs.platform || 'all') == 'all' &&
      (inputs.arch || 'all') == 'all'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    needs:
      - quality-gates
      - macos
      - linux
      - windows
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Verify release versions
        run: |
          bash scripts/ci/verify_versions.sh release-artifacts
          version="$(awk '/^version: / { split($2, parts, "+"); print parts[1]; exit }' pubspec.yaml)"
          python3 scripts/ci/verify_release_packages.py release-artifacts "$version" "$NAUTERM_BUILD_NUMBER"

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          cd release-artifacts
          RELEASE_TITLE="Nauterm ${TAG_NAME#v}"
          sha256sum * > SHA256SUMS.txt
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" * --clobber
            gh release edit "$TAG_NAME" --title "$RELEASE_TITLE"
          else
            gh release create "$TAG_NAME" * --title "$RELEASE_TITLE" --generate-notes
          fi
