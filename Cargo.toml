[workspace]
members = ["native/nauterm_core", "native/nauterm_cmd_integration", "nauterm-rs"]
resolver = "2"

[patch.crates-io]
gpui-pre-linux = { git = "https://github.com/korvect/gpui-pre-linux", rev = "9a0678a59ce53bceb1da9e63d8b7e4f1f7109267" }
gpui-pre-windows = { git = "https://github.com/korvect/gpui-pre-windows", rev = "33821bf8ffbad3eb87a5befda0f2a3fdb05efb91" }

[workspace.package]
version = "0.4.0"
publish = false

[workspace.dependencies]
base64 = "0.23.1"
futures-util = "0.3"
libc = "0.2"
opendal = { version = "0.59.5", default-features = false }
reqwest = { version = "0.13", default-features = false }
russh = { version = "0.64.1", default-features = false, features = ["ring", "rsa"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.11"
tempfile = "3"
tokio = "1"
toml = "1.1"
url = "=2.5.8"
zeroize = "1"

[profile.dev]
debug = 0
incremental = false

[profile.dev.package."*"]
debug = 0

# Dependency workspace profiles are not inherited. Keep GPUI's layout/scene
# hot paths optimized during `make rs-run`, as in gpui-kit's own dev profile.
[profile.dev.package.gpui-pre]
opt-level = 3

[profile.dev.package.gpui-pre-sum-tree]
opt-level = 3

[profile.dev.package.taffy]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
