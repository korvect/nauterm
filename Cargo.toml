[workspace]
members = ["native/nauterm_core", "native/nauterm_cmd_integration", "nauterm-rs"]
resolver = "2"
exclude = ["third_party/gpui-pre-linux"]

[patch.crates-io]
gpui-pre-linux = { path = "third_party/gpui-pre-linux" }

[workspace.package]
version = "0.3.9"
publish = false

[workspace.dependencies]
base64 = "0.23.1"
futures-util = "0.3"
libc = "0.2"
opendal = { version = "0.59.5", default-features = false }
reqwest = { version = "0.13", default-features = false }
russh = { version = "0.64.1", default-features = false, features = ["ring", "rsa"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.11"
tempfile = "3"
tokio = "1"
toml = "1.1"
url = "=2.5.8"
zeroize = "1"

[profile.dev]
debug = 0
incremental = false

[profile.dev.package."*"]
debug = 0

# Dependency workspace profiles are not inherited. Keep GPUI's layout/scene
# hot paths optimized during `make run-rs`, as in gpui-kit's own dev profile.
[profile.dev.package.gpui-pre]
opt-level = 3

[profile.dev.package.gpui-pre-sum-tree]
opt-level = 3

[profile.dev.package.taffy]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
